services:
  opencouchpad:
    image: ghcr.io/maros-o/opencouchpad:latest
    # build: .            # or build locally
    container_name: opencouchpad
    restart: unless-stopped
    network_mode: host    # required: mDNS (remote.local) and LAN access
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      # lets OpenCouchpad detect the keyboard layout (Debian / Raspberry Pi OS)
      - /etc/default/keyboard:/etc/default/keyboard:ro
    environment:
      OPENCOUCHPAD_NAME: "Living room"   # shown in the UI
      OPENCOUCHPAD_HOST: "remote"        # → http://remote.local
      # OPENCOUCHPAD_PIN: "1234"         # recommended on shared networks
      # OPENCOUCHPAD_PORT: "8080"
      # OPENCOUCHPAD_LAYOUT: "us"        # override layout detection
